<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  canvas {
      border: 1px solid #6105e2;
      box-shadow: 4px 4px 8px #888888;
      background-color: #f1f1f1;
      display: block;
      margin: 20px auto;
      border-radius: 15px;
  }

  #scorePanel {
      color: #7507e2;
      text-align: center;
      font-size: 18px;
      margin-bottom: 10px;
  }

  button {
      background-color: #6a5acd; /* Lila Farbton */
      color: white;
      padding: 10px 20px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 10px 5px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      transition: background-color 0.3s;
  }

  button:hover {
      background-color: #4169e1; /* Blauer Farbton */
  }

  @media (max-width: 600px) {
      canvas {
          width: 100%;
          height: auto;
      }
      button {
          padding: 8px 16px;
          font-size: 14px;
      }
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<div id="scorePanel">
    Aktueller Punktestand: <span id="score">0</span>
    <br>
    Highscore: <span id="highscore">0</span>
</div>
<button onclick="startGame()">Starten</button>
<button onclick="pauseGame()">Pause</button>
<button onclick="stopGame()">Stop</button>
<button onclick="speedGame()">Schneller</button>

<script>
  var highscore = localStorage.getItem('highscore') || 0;
  document.getElementById('highscore').textContent = highscore;
  var canvas = document.getElementById('game');
  var context = canvas.getContext('2d');
  var grid = 16;
  var count = 0;
  var score = 0;
  var highscore = 0;
  var gameRunning = false;
  
  
  var snake = {
    x: 160,
    y: 160,
    dx: grid,
    dy: 0,
    cells: [],
    maxCells: 4
  };
  var apple = {
    x: getRandomInt(0, 25) * grid,
    y: getRandomInt(0, 25) * grid
  };


  function updateScore(newScore) {
  score = newScore;
  document.getElementById('score').textContent = score;

  if (score > highscore) {
    highscore = score;
    localStorage.setItem('highscore', highscore);
    document.getElementById('highscore').textContent = highscore;
  }
}

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min)) + min;
  }

  function startGame() {
    if (!gameRunning) {
      snake.x = 160;
      snake.y = 160;
      snake.cells = [];
      snake.maxCells = 4;
      snake.dx = grid;
      snake.dy = 0;
      apple.x = getRandomInt(0, 25) * grid;
      apple.y = getRandomInt(0, 25) * grid;
      score = 0;
      document.getElementById('score').textContent = score;
      gameRunning = true;
      loop();
    }
  }

  function speedGame() {
    gameRunning = !gameRunning;
    if (speed > 0.5) {
        speed--;
    }
}

  function pauseGame() {
    gameRunning = !gameRunning;
    if (gameRunning) {
        requestAnimationFrame(loop);
    } else {
        cancelAnimationFrame(animationFrameId);
    }
}

  function stopGame() {
    gameRunning = false;
    cancelAnimationFrame(animationFrameId);
  }

   // Spiel-Loop
   function loop() {
    if (!gameRunning) return;
    animationFrameId = requestAnimationFrame(loop);
    if (++count < 6) {
      return;
    }
    count = 0;
    context.clearRect(0,0,canvas.width,canvas.height);

    snake.x += snake.dx;
    snake.y += snake.dy;

    // Wrap snake position horizontally on edge of screen
    if (snake.x < 0) {
      snake.x = canvas.width - grid;
    }
    else if (snake.x >= canvas.width) {
      snake.x = 0;
    }
    
    // Wrap snake position vertically on edge of screen
    if (snake.y < 0) {
      snake.y = canvas.height - grid;
    }
    else if (snake.y >= canvas.height) {
      snake.y = 0;
    }

    // Keep track of where snake has been. Front of the array is always the head
    snake.cells.unshift({x: snake.x, y: snake.y});

    // Remove cells as we move away from them
    if (snake.cells.length > snake.maxCells) {
      snake.cells.pop();
    }

    // Draw apple
    context.fillStyle = 'red';
    context.fillRect(apple.x, apple.y, grid-1, grid-1);

    // Draw snake
    context.fillStyle = 'green';
    snake.cells.forEach(function(cell, index) {
      
      context.fillRect(cell.x, cell.y, grid-1, grid-1);  

   // Snake hat einen Apfel gefressen
    if (cell.x === apple.x && cell.y === apple.y) {
  snake.maxCells++;
  updateScore(score + 1); // Erhöhe den Punktestand

  // Canvas ist 400x400 welches ist 25x25 Raster
  apple.x = getRandomInt(0, 25) * grid;
  apple.y = getRandomInt(0, 25) * grid;
}

      // Check collision with all cells after this one (modified)
      for (var i = index + 1; i < snake.cells.length; i++) {
        
        // Snake occupies same space as a body part. Reset game
        if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
          snake.x = 160;
          snake.y = 160;
          snake.cells = [];
          snake.maxCells = 4;
          snake.dx = grid;
          snake.dy = 0;

          apple.x = getRandomInt(0, 25) * grid;
          apple.y = getRandomInt(0, 25) * grid;
        }
      }
    });
  }

  
  

   // Kontrolliere die Schlange mit den Pfeiltasten
   document.addEventListener('keydown', function(e) {
    // Verhindere das Bewegen der Schlange in die entgegengesetzte Richtung
    if (e.which === 37 && snake.dx === 0) {
      snake.dx = -grid;
      snake.dy = 0;
    }
    else if (e.which === 38 && snake.dy === 0) {
      snake.dy = -grid;
      snake.dx = 0;
    }
    else if (e.which === 39 && snake.dx === 0) {
      snake.dx = grid;
      snake.dy = 0;
    }
    else if (e.which === 40 && snake.dy === 0) {
      snake.dy = grid;
      snake.dx = 0;
    }
  });

  // Initialer Aufruf der Startfunktion
  startGame();
</script>
</body>
</html>
